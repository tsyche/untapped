name: ci
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.md'
      - 'justfile'
      - 'scripts/check-docs.sh'
      - '.github/workflows/ci.yml'
      - 'conf/**'
      - 'lib/**'
      - 'bin/**'
      - 'tests/**'
permissions:
  contents: read
# A newer push to the same PR supersedes the in-flight run; pushes to other
# refs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - name: check-docs
        run: just check-docs
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x lib/*.sh bin/untapped scripts/*.sh tests/test_helper.bash tests/*.bats
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: |
          if ! command -v bats >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
            /tmp/bats-core/install.sh "$HOME/.local"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          bats --version
      - name: Run tests
        run: bats tests/*.bats

